name: autobuild master

on:
  workflow_dispatch:

permissions:
  contents: write
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Clone private repo
        env:
          GH_PAT: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/nuclearmagneton/news.git private-code

      - name: Re-generate m3u playlist
        run: |
          cd private-code
          bash script.sh
          cd ../../

      - name: Get current India date and time
        id: date
        run: echo "date=$(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Commit and push to news repository
        run: |
          cd private-code
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🔁 Update playlists ${{ steps.date.outputs.date }}" || echo "No changes to commit"
          git push https://${{ secrets.PRIVATE_SOURCE_TOKEN }}@github.com/nuclearmagneton/news.git HEAD:master || echo "Nothing to push"
          cd ../../
